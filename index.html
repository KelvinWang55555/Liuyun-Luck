<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e7">
<title>周易 · 占筮</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☯</text></svg>">
<style>
  :root{
    --paper:#f6f1e7; --paper2:#efe7d6; --ink:#2c2823; --ink2:#6f6553;
    --verm:#a63a2b; --gold:#9a7b2e; --line:#d8cdb4; --card:#fffdf7;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
    background:var(--paper); color:var(--ink);
    max-width:520px; margin:0 auto; min-height:100vh;
    display:flex; flex-direction:column;
    background-image:radial-gradient(circle at 15% 8%, rgba(166,58,43,.05) 0 60px, transparent 61px),
                     radial-gradient(circle at 85% 92%, rgba(154,123,46,.06) 0 80px, transparent 81px);
  }
  header{
    text-align:center; padding:22px 16px 14px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(246,241,231,.92); backdrop-filter:blur(6px); z-index:10;
  }
  header h1{font-size:26px; letter-spacing:14px; text-indent:14px; font-weight:600}
  header .sub{font-size:12px; color:var(--ink2); margin-top:4px; letter-spacing:2px}
  nav{
    display:flex; border-bottom:1px solid var(--line); position:sticky; top:74px;
    background:rgba(246,241,231,.95); backdrop-filter:blur(6px); z-index:10;
  }
  nav button{
    flex:1; padding:12px 0 10px; background:none; border:none; font-family:inherit;
    font-size:15px; color:var(--ink2); letter-spacing:3px; text-indent:3px;
    border-bottom:2px solid transparent; cursor:pointer;
  }
  nav button.active{color:var(--verm); border-bottom-color:var(--verm); font-weight:600}
  main{flex:1; padding:18px 16px 90px}
  .panel{display:none}
  .panel.active{display:block; animation:fade .3s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px; margin-bottom:14px; box-shadow:0 2px 10px rgba(44,40,35,.05);
  }
  .card h2{font-size:16px; letter-spacing:4px; color:var(--verm); margin-bottom:12px; font-weight:600}
  .muted{color:var(--ink2); font-size:13px; line-height:1.7}
  .btn{
    display:inline-block; background:var(--verm); color:#fff; border:none; font-family:inherit;
    padding:11px 22px; border-radius:10px; font-size:15px; letter-spacing:3px; text-indent:3px;
    cursor:pointer; box-shadow:0 3px 8px rgba(166,58,43,.3);
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:none; color:var(--verm); border:1px solid var(--verm); box-shadow:none}
  .btn.gold{background:var(--gold); box-shadow:0 3px 8px rgba(154,123,46,.3)}
  /* 卦象绘制 */
  .gua-lines{display:flex; flex-direction:column-reverse; gap:9px; align-items:center; margin:14px 0}
  .line-yang{width:130px; height:11px; background:var(--ink); border-radius:2px}
  .line-yin{width:130px; height:11px; display:flex; justify-content:space-between}
  .line-yin span{display:block; width:52px; height:11px; background:var(--ink); border-radius:2px}
  .line.changed{position:relative}
  .line.changed::after{
    content:"◉"; position:absolute; right:-24px; top:50%; transform:translateY(-50%);
    color:var(--verm); font-size:13px;
  }
  .gua-title{text-align:center}
  .gua-title .sym{font-size:54px; line-height:1; color:var(--verm)}
  .gua-title .fname{font-size:22px; letter-spacing:6px; text-indent:6px; margin-top:6px; font-weight:600}
  .gua-title .trigrams{font-size:13px; color:var(--ink2); margin-top:4px; letter-spacing:2px}
  .quote{border-left:3px solid var(--gold); padding:8px 12px; margin:10px 0; background:rgba(154,123,46,.06); border-radius:0 8px 8px 0}
  .quote p{font-size:14px; line-height:1.8}
  .quote .tag{font-size:11px; color:var(--gold); letter-spacing:2px}
  /* 金钱课 */
  .coins{display:flex; justify-content:center; gap:14px; margin:16px 0}
  .coin{
    width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:600; background:radial-gradient(circle at 32% 30%, #e8c96a, #9a7b2e 75%);
    color:#4a3a10; box-shadow:0 4px 12px rgba(0,0,0,.2); transition:transform .5s;
  }
  .coin.flip{animation:spin .55s ease}
  @keyframes spin{0%{transform:rotateY(0) scale(1)}50%{transform:rotateY(360deg) scale(1.15)}100%{transform:rotateY(720deg) scale(1)}}
  .toss-log{font-size:12px; color:var(--ink2); text-align:center; letter-spacing:1px; margin-top:6px}
  /* 表单 */
  .field{margin-bottom:14px}
  .field label{display:block; font-size:13px; color:var(--ink2); margin-bottom:6px; letter-spacing:1px}
  .field input{
    width:100%; padding:11px 12px; border:1px solid var(--line); border-radius:10px;
    font-size:16px; font-family:inherit; background:#fff; color:var(--ink);
  }
  .field input:focus{outline:none; border-color:var(--verm)}
  /* 卦典 */
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
  .grid .cell{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 4px 8px; text-align:center; cursor:pointer;
  }
  .grid .cell .s{font-size:22px; color:var(--verm)}
  .grid .cell .nm{font-size:12px; margin-top:3px; color:var(--ink)}
  /* 热点 */
  .news-item{padding:11px 4px; border-bottom:1px dashed var(--line)}
  .news-item:last-child{border-bottom:none}
  .news-item .idx{color:var(--verm); font-weight:600; margin-right:8px; font-size:13px}
  .news-item a{color:var(--ink); text-decoration:none; font-size:14px; line-height:1.6}
  .news-date{text-align:center; font-size:12px; color:var(--gold); letter-spacing:2px; margin-bottom:10px}
  /* 历史 */
  .hist-item{padding:10px 4px; border-bottom:1px dashed var(--line); cursor:pointer; display:flex; justify-content:space-between; align-items:center}
  .hist-item .s{font-size:20px; color:var(--verm)}
  .hist-item .info{flex:1; margin-left:10px}
  .hist-item .info .n{font-size:14px}
  .hist-item .info .d{font-size:11px; color:var(--ink2)}
  /* 弹层 */
  .modal{
    position:fixed; inset:0; background:rgba(44,40,35,.45); z-index:50;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal.show{display:flex}
  .modal .sheet{
    background:var(--paper); width:100%; max-width:520px; max-height:82vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:20px 18px 30px; animation:up .25s ease;
  }
  @keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
  .close-x{float:right; font-size:22px; color:var(--ink2); cursor:pointer; background:none; border:none; font-family:inherit}
  footer{text-align:center; font-size:11px; color:var(--ink2); padding:0 16px 30px; letter-spacing:1px}
  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%);
    background:rgba(44,40,35,.85); color:#fff; font-size:13px; padding:9px 18px;
    border-radius:20px; z-index:99; display:none; letter-spacing:1px;
  }
  /* 命理 */
  .pillar{display:flex; gap:8px; justify-content:center; margin:12px 0}
  .pillar .p{flex:1; max-width:88px; background:var(--paper2); border:1px solid var(--line); border-radius:10px; padding:9px 4px; text-align:center}
  .pillar .p .t{font-size:20px; font-weight:600; letter-spacing:2px}
  .pillar .p .n{font-size:11px; color:var(--ink2); margin-top:3px}
  .pillar .p .py{font-size:10px; color:var(--gold); margin-top:1px}
  .el-bar{display:flex; align-items:center; margin:7px 0; font-size:13px}
  .el-bar .lab{width:52px; letter-spacing:2px}
  .el-bar .lab i{font-style:normal; color:var(--gold); font-size:10px; margin-left:2px}
  .el-bar .track{flex:1; height:10px; background:var(--paper2); border-radius:5px; overflow:hidden}
  .el-bar .fill{height:100%; border-radius:5px}
  .el-bar .cnt{width:44px; text-align:right; color:var(--ink2); font-size:12px}
  .score-ring{position:relative; width:110px; height:110px; margin:6px auto}
  .score-ring svg{transform:rotate(-90deg)}
  .score-ring .num{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
  .score-ring .num b{font-size:30px; color:var(--verm)}
  .score-ring .num span{font-size:10px; color:var(--ink2); letter-spacing:2px}
  .lucky-row{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px}
  .lucky-row .chip{background:var(--paper2); border:1px solid var(--line); border-radius:16px; padding:6px 12px; font-size:12px}
  .lucky-row .chip b{color:var(--verm)}
  .py-note{font-size:11px; color:var(--gold); text-align:center; letter-spacing:1px; margin-top:2px; font-style:italic}
</style>
</head>
<body>
<header>
  <h1>周 易</h1>
  <div class="sub" id="todayStr">—</div>
</header>

<nav>
  <button class="active" data-panel="daily">每日一卦</button>
  <button data-panel="divine">起 卦</button>
  <button data-panel="classic">卦 典</button>
  <button data-panel="destiny">命 理</button>
  <button data-panel="news">热 点</button>
</nav>

<main>
  <!-- 每日一卦 -->
  <section class="panel active" id="panel-daily">
    <div class="card" id="dailyCard">
      <h2>今 日 卦</h2>
      <div id="dailyBody"></div>
      <div style="text-align:center;margin-top:8px">
        <button class="btn ghost" id="dailyDetail">查看卦典详解</button>
      </div>
    </div>
    <div class="card">
      <h2>占 筑 历</h2>
      <div class="muted" id="histEmpty" style="display:none">还没有占筮记录。去「起卦」摇一摇吧。</div>
      <div id="histList"></div>
      <div style="text-align:center;margin-top:10px">
        <button class="btn ghost" id="clearHist" style="font-size:13px;padding:7px 16px">清空记录</button>
      </div>
    </div>
  </section>

  <!-- 起卦 -->
  <section class="panel" id="panel-divine">
    <div class="card">
      <h2>金 钱 课</h2>
      <p class="muted">凝神静想所问之事，连摇六次，每次掷三枚铜钱。</p>
      <div class="coins" id="coins">
        <div class="coin">💰</div><div class="coin">💰</div><div class="coin">💰</div>
      </div>
      <div style="text-align:center">
        <button class="btn" id="tossBtn">摇 一 摇</button>
        <button class="btn gold" id="tossReset" style="display:none">重 摇</button>
      </div>
      <div class="toss-log" id="tossLog"></div>
      <div id="coinResult"></div>
    </div>
    <div class="card">
      <h2>数 字 起 卦（梅花易数）</h2>
      <div class="field"><label>上卦数（先天八卦：乾1 兑2 离3 震4 巽5 坎6 艮7 坤8）</label>
        <input type="number" id="numUp" placeholder="如 7" min="1"></div>
      <div class="field"><label>下卦数</label>
        <input type="number" id="numDown" placeholder="如 3" min="1"></div>
      <div class="field"><label>动爻数（1–6，留空则用时辰自动取）</label>
        <input type="number" id="numYao" placeholder="留空自动" min="1" max="6"></div>
      <div style="text-align:center">
        <button class="btn" id="numBtn">起 卦</button>
      </div>
      <div id="numResult"></div>
    </div>
    <div class="card">
      <h2>心 问 一 签</h2>
      <div class="field"><label>默念所问之事（可选，仅存于本机）</label>
        <input type="text" id="intentText" placeholder="如：此事可否进行"></div>
      <div style="text-align:center">
        <button class="btn ghost" id="quickBtn">随 起 一 卦</button>
      </div>
    </div>
  </section>

  <!-- 卦典 -->
  <section class="panel" id="panel-classic">
    <div class="card">
      <h2>六 十 四 卦</h2>
      <div class="grid" id="guaGrid"></div>
    </div>
  </section>

  <!-- 命理 -->
  <section class="panel" id="panel-destiny">
    <div class="card" id="birthCard">
      <h2>我的 生 辰</h2>
      <div id="birthForm">
        <div class="field"><label>出生日期（公历）</label>
          <input type="date" id="birthDate"></div>
        <div class="field"><label>出生时辰（未知可选「时辰不详」）</label>
          <select id="birthHour" style="width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff">
            <option value="-1">时辰不详</option>
          </select></div>
        <div style="text-align:center">
          <button class="btn" id="birthSave">保 存</button>
          <button class="btn ghost" id="birthClear" style="display:none">删 除</button>
        </div>
      </div>
    </div>
    <div id="destinyResult"></div>
    <div id="destinyDaily"></div>
  </section>

  <!-- 热点 -->
  <section class="panel" id="panel-news">
    <div class="card">
      <h2>今 日 热 点</h2>
      <div id="newsBody"><p class="muted">加载中…</p></div>
      <p class="muted" style="margin-top:10px;font-size:11px">热点由 GitHub Actions 每日自动抓取更新。</p>
    </div>
  </section>
</main>

<footer>研几于道 · 占以决疑 —— 仅供个人参考<br>☯ 自用周易 · 数据存于本机</footer>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script src="data.js"></script>
<script src="bazi.js"></script>
<script src="app.js"></script>
</body>
</html>
